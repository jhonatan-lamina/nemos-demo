<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOME ROUTER - LOGIN</title>
    <link rel="shortcut icon" href="../img/icon.webp">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #ffffff;
            width: 350px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .logo h1 {
            color: #00a0df;
            margin-bottom: 5px;
        }
        .logo p {
            color: #777;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00a0df;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00a0df;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #007bb5;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>TP-LíNK</h1>
            <p>Login</p>
        </div>
        <form onsubmit="stop(event)">
            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="footer">
            <p>© 2026 TP-Línk Corporation Limited</p>
        </div>
    </div>
    <script>
        function stop(event) {
            event.preventDefault(); 
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
