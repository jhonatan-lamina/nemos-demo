<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IP CAMERA - LOGIN</title>
    <link rel="shortcut icon" href="../img/icon.webp">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .overlay {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            width: 360px;
            background: rgba(0, 0, 0, 0.75);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
        }
        .camera-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2 {
            margin: 5px 0;
            font-weight: 600;
        }
        .subtitle {
            font-size: 13px;
            color: #bbb;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1c1c1c;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00c3ff;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #00c3ff;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #00a2d4;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="login-box">
            <div class="camera-icon">🎥</div>
            <h2>IP CAMERA</h2>
            <p class="subtitle">Secure Login</p>
            <form onsubmit="stop(event)">
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="footer">
                Firmware v5.x.x
            </div>
        </div>
    </div>
    <script>
        function stop(event) {
            event.preventDefault(); 
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
