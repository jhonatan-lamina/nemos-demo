<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NAS - LOGIN</title>
    <link rel="shortcut icon" href="../img/icon.webp">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(180deg, #f5f7fa, #e4e8ef);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 380px;
            background: #ffffff;
            padding: 45px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #222;
        }
        .logo span {
            font-size: 13px;
            color: #666;
        }
        form {
            margin-top: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #d0d7e2;
            font-size: 14px;
            background: #f9fafc;
        }
        input:focus {
            outline: none;
            border-color: #3a8dde;
            background: #ffffff;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #3a8dde;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2c74c9;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="login-card">
            <div class="logo">
                <h1>SYN0L0GY</h1>
                <span>DiskStation Manager</span>
            </div>
            <form onsubmit="stop(event)">
                <input type="text" placeholder="Account" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="footer">
                DSM 7.x
            </div>
        </div>
    </div>
    <script>
        function stop(event) {
            event.preventDefault(); 
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
